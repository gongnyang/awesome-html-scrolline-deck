name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { node: [20, 22] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm ci
      - run: npm test
      - run: node scripts/cli.mjs check examples/sample-deck
      - run: cd examples/sample-deck && npm ci && npm run build
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm install --no-save --package-lock=false playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: node scripts/ci/verify-all.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: qa, path: examples/*/qa }
