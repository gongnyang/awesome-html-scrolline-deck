<section class="o" aria-labelledby="options-title">
  <div class="o__inner">
    <header class="o__head">
      <p class="o__kicker" data-role="kicker"></p>
      <h2 class="o__title" id="options-title" data-role="title"></h2>
    </header>
    <div class="o__compare" data-role="compare" aria-label="세 파일럿 범위 빠른 비교"></div>
    <div class="o__decision" data-role="decision">
      <div class="o__decision-head">
        <div>
          <p class="o__decision-kicker" data-role="decision-kicker"></p>
          <h3 class="o__standard" data-role="standard"></h3>
        </div>
        <p class="o__reason" data-role="reason"></p>
      </div>
      <dl class="o__evidence" data-role="evidence" aria-label="표준안 운영 범위와 근거"></dl>
      <div class="o__alternatives" data-role="alternatives" aria-label="다른 선택지"></div>
    </div>
    <p class="o__source" data-role="source"></p>
  </div>
</section>
