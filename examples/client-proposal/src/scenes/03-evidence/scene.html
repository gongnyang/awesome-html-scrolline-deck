<div class="queue-chart">
  <header class="queue-chart__head">
    <div>
      <p class="queue-chart__kicker" data-role="kicker"></p>
      <h2 class="queue-chart__title" data-role="title"></h2>
    </div>
    <div class="queue-chart__metric" aria-label="피크 대기 중앙값">
      <span class="queue-chart__metric-label">피크 대기 중앙값</span>
      <strong data-role="wait"></strong><em>분</em>
      <span class="queue-chart__metric-foot">13–14시 · 가상 관찰</span>
    </div>
  </header>
  <div class="queue-chart__plot">
    <div class="queue-chart__band" aria-hidden="true"><span>13시 · 최고 혼잡</span></div>
    <div class="queue-chart__grid" aria-hidden="true"><span>100</span><span>50</span><span>0</span></div>
    <svg class="queue-chart__svg" viewBox="0 0 1000 320" preserveAspectRatio="none" role="img" aria-label="가상 시나리오의 시간대별 혼잡 지수. 10시부터 15시까지 개별 시간대 지수를 막대로 비교하며 13시가 100으로 가장 높습니다.">
      <g data-role="bars"></g>
    </svg>
    <div class="queue-chart__hours" data-role="hours"></div>
  </div>
  <footer class="queue-chart__source"><span>관찰 시뮬레이션</span><p data-role="source"></p></footer>
</div>
