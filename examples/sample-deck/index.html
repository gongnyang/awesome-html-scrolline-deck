<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Scrolline Deck</title>
    <meta name="description" content="스크롤로 굴리는 시네마 HTML 발표자료" />
  </head>
  <body class="deck-body">
    <a class="skip-link" href="#deck">Skip to the deck</a>

    <div id="preloader" hidden>
      <p class="t-mono" id="preloader-label">0%</p>
    </div>

    <div id="progress" role="progressbar" aria-label="Deck progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span id="progress-bar"></span>
    </div>

    <main id="deck"></main>

    <p id="hud" aria-hidden="true"></p>

    <aside id="notes" hidden aria-label="Speaker notes">
      <p id="notes-title"></p>
      <p id="notes-body"></p>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
