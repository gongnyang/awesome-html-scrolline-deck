<div class="rhythm">
  <header class="rhythm__head">
    <p class="rhythm__kicker" data-role="kicker"></p>
    <h2 class="rhythm__title" data-role="title"></h2>
  </header>
  <div class="rhythm__body">
    <ol class="rhythm__phases" data-role="phases"></ol>
    <div class="rhythm__demo">
      <div class="rhythm__window">
        <div class="rhythm__chrome"><span></span><span></span><span></span><b>LIVE SCENE</b></div>
        <div class="rhythm__viewport">
          <span class="rhythm__state" data-role="state">진입 · 시선을 모으다</span>
          <div class="rhythm__visual"><span class="rhythm__visual-mark">→</span><strong>한 문장<br>한 화면</strong></div>
          <p class="rhythm__explain" data-role="explain">제목과 시각 단서가 들어옵니다.</p>
        </div>
      </div>
      <div class="rhythm__timeline">
        <div class="rhythm__track"><div class="rhythm__fill"></div></div>
        <div class="rhythm__ticks"><span>진입</span><span>홀드</span><span>퇴장</span></div>
      </div>
    </div>
  </div>
</div>
