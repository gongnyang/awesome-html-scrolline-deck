<section class="ch" aria-labelledby="{{id}}-title">
  <header class="ch__head">
    <p class="ch__kicker" data-role="kicker"></p>
    <h2 class="ch__title" id="{{id}}-title" data-role="title"></h2>
  </header>
  <figure class="ch__figure" data-role="figure">
    <div class="ch__scale" data-role="scale" aria-hidden="true"></div>
    <div class="ch__plot" data-role="plot" role="img"></div>
    <figcaption class="ch__source" data-role="source"></figcaption>
  </figure>
</section>
