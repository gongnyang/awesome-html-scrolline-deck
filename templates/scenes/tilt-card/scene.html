<div class="voice">
  <div class="voice__copy">
    <p class="voice__kicker" data-role="kicker"></p>
    <blockquote class="voice__quote">
      <span class="voice__quote-mark" aria-hidden="true">“</span>
      <h2 class="voice__title" data-role="title"></h2>
    </blockquote>
    <ol class="voice__observations" data-role="lines" aria-label="발언의 맥락과 확인 근거"></ol>
  </div>
  <figure class="voice__figure" data-role="figure">
    <div class="voice__images" data-role="images" aria-hidden="true"></div>
    <span class="voice__frame-count" data-role="frame-count" aria-hidden="true">01 / 01</span>
    <figcaption class="voice__credit" data-role="caption"></figcaption>
  </figure>
</div>
